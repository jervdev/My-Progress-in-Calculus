<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="An activity from Jervee Manangan's 2CALC-IT portfolio, with its photos or video.">
    <title>Activity | Jervee Manangan</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="script.js" defer></script>
  </head>
  <body data-page="paper">
    <nav id="navbar">
      <div class="page-width paper-nav">
        <a href="index.html#projects">← Back to my work</a>
        <span>2CALC-IT</span>
      </div>
    </nav>

    <main id="paper-main" class="paper-main page-width">
      <header class="paper-heading">
        <p class="section-label" id="paper-term">LEARNING ARTIFACT</p>
        <h1 id="paper-title">My work</h1>
        <p class="paper-topic" id="paper-topic"></p>
      </header>

      <div id="paper-content" hidden>
        <section class="paper-output">
          <div class="page-controls">
            <p id="page-count"></p>
            <div id="page-navigation" hidden>
              <label for="page-select">Jump to page</label>
              <select id="page-select"></select>
            </div>
          </div>
          <div id="paper-pages"></div>
        </section>
      </div>

      <div class="empty-paper" id="paper-not-found" hidden>
        <h2>Activity not found</h2>
        <p>Choose an activity or assessment from the portfolio.</p>
        <a class="button" href="index.html#projects">View my work</a>
      </div>
      <noscript><p>Please enable JavaScript to view this activity.</p></noscript>
    </main>

    <footer class="page-width">
      <p>Jervee Manangan / 2CALC-IT</p>
      <a href="#paper-main">Back to top ↑</a>
    </footer>
  </body>
</html>
